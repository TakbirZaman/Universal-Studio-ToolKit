name: Generate typed Rust bridge
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, work/pack-catalogue, work/direct-photo-crop, work/custom-packs, work/offline-ocr, work/photo-density, work/safe-scan-session, work/print-layout, work/pdf-overlays, work/pdf-text, work/scan-perspective]
    paths: ['rust/src/**', 'rust/Cargo.*', 'lib/src/rust/**', 'flutter_rust_bridge.yaml', 'pubspec*', 'scripts/collect_bridge.py', '.github/workflows/generate-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      RUST_LOG: info
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned development tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          cargo install cargo-expand --version 1.0.118 --locked
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Generate bindings without changing dependency versions
        run: |
          flutter pub get --enforce-lockfile
          flutter_rust_bridge_codegen generate --rust-input crate::api --rust-root rust/ --dart-output lib/src/rust --no-web --no-deps-check --no-dart-fix --no-auto-upgrade-dependency
          cargo fmt --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --check
          python3 scripts/collect_bridge.py
      - name: Upload reviewable generated source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-bridge-source
          path: dist/generated-bridge.json
          retention-days: 3
          if-no-files-found: error
      - name: Analyze generated integration
        run: flutter analyze --no-pub
      - name: Reject stale committed bindings
        run: git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs
