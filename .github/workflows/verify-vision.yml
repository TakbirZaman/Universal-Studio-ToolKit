name: Verify scanner geometry adapter candidate
on:
  push:
    branches: [work/scan-perspective]
    paths: ['native/opencv/**', 'scripts/*vision*', '.github/workflows/verify-vision.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned development dependencies
        run: python -m pip install cmake==3.28.4 ninja==1.13.2 numpy==2.3.5 Pillow==12.3.0
      - name: Build from verified source and check actual pixel output
        run: python scripts/verify_vision_candidate.py --platform ${{ matrix.platform }} --work vision-verification
      - name: Retain text-only verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vision-verification-${{ matrix.platform }}
          path: vision-verification/pixel-verification.json
          retention-days: 3
          if-no-files-found: error
