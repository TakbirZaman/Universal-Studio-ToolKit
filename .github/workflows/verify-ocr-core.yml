name: Verify experimental OCR core
on:
  push:
    branches: [work/offline-ocr]
    paths: ['rust/**', '.github/workflows/verify-ocr-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Test OCR boundaries and platform compilation
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib --bin studio --test ocr
