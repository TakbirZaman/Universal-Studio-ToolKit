name: Verify and build Linux
on:
  push:
    branches: [main]
    paths: ['rust/**', 'lib/**', 'test/**', 'pubspec*', 'linux/**', 'scripts/build_linux.sh', 'scripts/smoke_linux.sh', '.github/workflows/verify-linux.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      UST_PDFIUM_LIBRARY: ${{ github.workspace }}/native/linux-x64/libpdfium.so
      UST_CORE_LIBRARY: ${{ github.workspace }}/rust/target/debug/libstudio_core.so
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb x11-utils
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify locked Rust core
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo test --locked --manifest-path rust/Cargo.toml
          cargo build --locked --manifest-path rust/Cargo.toml
      - name: Analyze and test Flutter integration
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          mapfile -t tests < <(find test -name '*_test.dart' ! -name 'visual_test.dart' | sort)
          flutter test --no-pub "${tests[@]}"
      - name: Render home screens (capture only, baseline review pending)
        run: flutter test --no-pub --update-goldens test/visual_test.dart
      - name: Build portable Linux bundle
        run: bash scripts/build_linux.sh
      - name: Verify native runtime dependencies
        run: |
          ldd build/linux/x64/release/bundle/universal_studio_toolkit | tee /tmp/ust-runtime.txt
          ! grep -q 'not found' /tmp/ust-runtime.txt
          test -f build/linux/x64/release/bundle/lib/libstudio_core.so
          test -f build/linux/x64/release/bundle/lib/libpdfium.so
          sha256sum dist/universal-studio-linux-x64.tar.gz > dist/SHA256SUMS
      - name: Launch packaged application on build host
        run: xvfb-run -a bash scripts/smoke_linux.sh
      - name: Upload development bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal-studio-linux-x64-development
          path: dist/
          retention-days: 3
          if-no-files-found: error
