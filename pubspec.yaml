name: universal_studio_toolkit
description: Private offline document preparation for photos, scans and PDFs.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_rust_bridge: 2.13.0
  file_selector: 1.1.0
  crypto: 3.0.7
  ffi: 2.1.4
  path: 1.9.1
  path_provider: 2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: StudioRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: StudioNotoBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
